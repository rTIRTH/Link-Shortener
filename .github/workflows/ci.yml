name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkshortener
          POSTGRES_PASSWORD: linkshortener
          POSTGRES_DB: linkshortener
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linkshortener"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest --cov=app --cov-report=term-missing
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql://linkshortener:linkshortener@localhost:5432/linkshortener
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t link-shortener:ci .
