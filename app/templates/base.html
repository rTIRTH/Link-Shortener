<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Link Shortener{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Link Shortener</a>
    <nav>
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <details class="menu" id="usermenu">
          <summary aria-label="Account menu for {{ user.username }}">
            <img class="avatar" src="/static/avatars/{{ user.avatar }}.svg" alt="" width="36" height="36">
          </summary>
          <div class="menu-panel">
            <div class="menu-head">
              <img class="avatar" src="/static/avatars/{{ user.avatar }}.svg" alt="" width="40" height="40">
              <div><strong>{{ user.username }}</strong><small>{{ user.email }}</small></div>
            </div>
            <a class="menu-item" href="/account">Account settings</a>
            {% if is_admin %}<a class="menu-item" href="/admin">Admin</a>{% endif %}
            <form method="post" action="/logout"><button class="menu-item" type="submit">Log out</button></form>
          </div>
        </details>
      {% else %}
        <a href="/login">Log in</a>
        <a class="btn small" href="/register">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for category, message in flashes %}
      <div class="flash {{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      var menu = document.getElementById('usermenu');
      if (!menu) return;
      document.addEventListener('click', function (e) { if (menu.open && !menu.contains(e.target)) menu.open = false; });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') menu.open = false; });
    })();
  </script>
  <script src="/static/app.js?v={{ js_version }}" defer></script>
  <script src="/static/datetime-picker.js?v={{ js_version }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
