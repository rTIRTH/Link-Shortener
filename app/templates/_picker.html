{# Date and time picker. Needs /static/datetime-picker.js. Without JavaScript it is a plain text box. #}
{% macro datetime_picker(label, name, kind, dt=None, hint="optional, your local time") -%}
<div class="dtp-field">
  <label for="{{ name }}-input">{{ label }} {% if hint %}<small>({{ hint }})</small>{% endif %}</label>
  <div class="dtp" data-dtp data-kind="{{ kind }}">
    <input type="text" class="dtp-input" id="{{ name }}-input" name="{{ name }}" autocomplete="off" spellcheck="false"
           placeholder="Pick a date or type DD/MM/YYYY" value="{{ dt|utc_pretty }}" data-utc="{{ dt|utc_iso }}">
    <button type="button" class="dtp-toggle" aria-label="Open calendar for {{ label|lower }}" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="14" height="12.5" rx="2"/><path d="M3 8.5h14M7 2.8v3.4M13 2.8v3.4"/>
      </svg>
    </button>
    <input type="hidden" name="{{ name }}_utc">
  </div>
  <div class="dtp-error" role="alert" hidden></div>
</div>
{%- endmacro %}
