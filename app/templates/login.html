{% extends "base.html" %}
{% block title %}Log in · Link Shortener{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Log in</h1>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>Username or email
      <input name="identifier" required value="{{ form.identifier if form else '' }}" autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="/register">Create an account</a></p>
</section>
{% endblock %}
