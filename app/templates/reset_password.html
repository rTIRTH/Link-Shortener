{% extends "base.html" %}
{% block title %}{{ _("Choose a new password") }} · Link Shortener{% endblock %}
{% block content %}
<section class="narrow">
  <h1>{{ _("Choose a new password") }}</h1>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/reset-password/{{ token }}" class="stack">
    <label>{{ _("New password") }}
      <input type="password" name="new_password" required minlength="8" maxlength="72" autocomplete="new-password" autofocus>
      <small>{{ _("At least 8 characters.") }}</small>
    </label>
    <label>{{ _("Repeat the new password") }}
      <input type="password" name="confirm_password" required minlength="8" maxlength="72" autocomplete="new-password">
    </label>
    <button class="btn" type="submit">{{ _("Change password") }}</button>
  </form>
</section>
{% endblock %}
