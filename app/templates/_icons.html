{# Small outline icons for buttons. They use the button's text colour, so they fit every theme. #}
{% macro icon(name, extra='') -%}
<svg class="ico{{ ' ' ~ extra if extra }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
{%- if name == 'edit' -%}
<path d="M9.5 4.5H7a3.5 3.5 0 0 0 0 7h2.5"/><path d="M8 8h6"/><path d="M14.5 4.5H17a3.5 3.5 0 0 1 3.4 2.7"/><path d="M11.2 18.2 17.2 12.2a1.9 1.9 0 0 1 2.7 2.7l-6 6-4.4 1.5z"/>
{%- elif name == 'analytics' -%}
<circle cx="8.5" cy="8" r="4.5"/><path d="M5.3 11.2 2.7 13.8"/><path d="M9 21v-3.5M13 21v-6.5M17 21v-10M21 21V4"/><path d="M2.5 22h19"/>
{%- elif name == 'share' -%}
<path d="M9 9.5H6.5A2.5 2.5 0 0 0 4 12v6.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V12A2.5 2.5 0 0 0 17.5 9.5H15"/><path d="M12 15.5V3.2"/><path d="m8.4 6.6 3.6-3.6 3.6 3.6"/>
{%- elif name == 'bar' -%}
<path d="M5 21v-8M12 21V4M19 21v-5"/>
{%- elif name == 'line' -%}
<path d="M3 17 9 10l4 4 8-9"/>
{%- elif name == 'area' -%}
<path d="M3 20v-7l6-5 4 4 8-7v15z"/>
{%- elif name == 'link' -%}
<path d="M10 6.5H7.5a5.5 5.5 0 0 0 0 11H10"/><path d="M14 6.5h2.5a5.5 5.5 0 0 1 0 11H14"/><path d="M8.5 12h7"/>
{%- elif name == 'archive' -%}
<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/>
{%- elif name == 'restore' -%}
<path d="M4 9h11a5 5 0 0 1 0 10H8"/><path d="m8 5-4 4 4 4"/>
{%- elif name == 'tag' -%}
<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V4a1 1 0 0 1 1-1h9l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.4"/>
{%- elif name == 'lock' -%}
<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
{%- elif name == 'download' -%}
<path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M5 19h14"/>
{%- elif name == 'sun' -%}
<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'monitor' -%}
<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
{%- elif name == 'moon' -%}
<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>
{%- elif name == 'copy' -%}
<rect x="9" y="9" width="11" height="11" rx="2.2"/><path d="M5 15V6.2A2.2 2.2 0 0 1 7.2 4H16"/>
{%- elif name == 'check' -%}
<path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- endif -%}
</svg>
{%- endmacro %}
