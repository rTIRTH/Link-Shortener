{# Small outline icons for buttons. They use the button's text colour, so they fit every theme. #}

<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

<path d="M5 21v-8M12 21V4M19 21v-5"/>

<path d="M3 17 9 10l4 4 8-9"/>
