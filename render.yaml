# Render "Blueprint": creates the web service and Redis (Key Value).
# The database is NOT created here any more: Render's free Postgres expires after 30 days.
# Use a permanent free Postgres (for example Neon) and paste its address when Render asks.
services:
  - type: web
    name: link-shortener
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true            # redeploy on every push to the connected branch
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "true"
      - key: DATABASE_URL
        sync: false             # you paste the Postgres address (a postgresql://... link)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: link-shortener-redis
          property: connectionString

  - type: keyvalue
    name: link-shortener-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []             # only your own services can connect
